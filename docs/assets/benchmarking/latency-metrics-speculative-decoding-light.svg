<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" aria-labelledby="title desc" role="img" viewBox="0 0 1200 560"><title id="title">Latency metrics with token bundling</title><desc id="desc">The client receives token 1 at 100 milliseconds, tokens 2 through 4 together at 140 milliseconds, and token 5 at 180 milliseconds. The two observed ITL gaps average 40 milliseconds. TPOT divides the 80 millisecond generation span by the four tokens after the first, giving 20 milliseconds per token.</desc><defs><marker id="axis-arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#94a3b8" d="M0,0 L8,4 L0,8 Z"/></marker><marker id="itl-arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#30a2ff" d="M0,0 L8,4 L0,8 Z"/></marker></defs><rect width="1200" height="560" fill="#f8fafc" rx="18"/><text x="56" y="48" fill="#454545" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="600">Latency with token bundling</text><text x="1144" y="48" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="end">5 tokens · 3 stream outputs</text><line x1="88" x2="1118" y1="210" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#axis-arrow)"/><text x="100" y="153" fill="#454545" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Request</text><line x1="100" x2="100" y1="170" y2="225" stroke="#64748b" stroke-width="2"/><circle cx="100" cy="210" r="6" fill="#64748b"/><text x="100" y="246" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle">0 ms</text><text x="350" y="92" fill="#454545" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Output 1</text><rect width="72" height="54" x="314" y="106" fill="#fff" stroke="#30a2ff" stroke-width="2" rx="10"/><rect width="44" height="32" x="328" y="117" fill="#eaf6ff" rx="6"/><text x="350" y="139" fill="#1769aa" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">T1</text><line x1="350" x2="350" y1="160" y2="225" stroke="#30a2ff" stroke-width="2"/><circle cx="350" cy="210" r="6" fill="#30a2ff"/><text x="350" y="246" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle">100 ms</text><text x="700" y="80" fill="#454545" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Output 2 · bundled</text><rect width="180" height="66" x="610" y="94" fill="#fff" stroke="#30a2ff" stroke-width="2" rx="10"/><rect width="44" height="32" x="628" y="111" fill="#eaf6ff" rx="6"/><rect width="44" height="32" x="678" y="111" fill="#eaf6ff" rx="6"/><rect width="44" height="32" x="728" y="111" fill="#eaf6ff" rx="6"/><text x="650" y="133" fill="#1769aa" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">T2</text><text x="700" y="133" fill="#1769aa" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">T3</text><text x="750" y="133" fill="#1769aa" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">T4</text><line x1="700" x2="700" y1="160" y2="225" stroke="#30a2ff" stroke-width="2"/><circle cx="700" cy="210" r="6" fill="#30a2ff"/><text x="700" y="246" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle">140 ms</text><text x="1050" y="92" fill="#454545" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Output 3</text><rect width="72" height="54" x="1014" y="106" fill="#fff" stroke="#30a2ff" stroke-width="2" rx="10"/><rect width="44" height="32" x="1028" y="117" fill="#eaf6ff" rx="6"/><text x="1050" y="139" fill="#1769aa" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">T5</text><line x1="1050" x2="1050" y1="160" y2="225" stroke="#30a2ff" stroke-width="2"/><circle cx="1050" cy="210" r="6" fill="#30a2ff"/><text x="1050" y="246" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle">180 ms</text><path fill="none" stroke="#64748b" stroke-width="2" d="M100 274 H350"/><path fill="none" stroke="#64748b" stroke-width="2" d="M100 268 V280 M350 268 V280"/><text x="225" y="302" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">TTFT 100 ms</text><line x1="365" x2="685" y1="274" y2="274" stroke="#30a2ff" stroke-width="3" marker-end="url(#itl-arrow)"/><text x="525" y="302" fill="#1769aa" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">ITL 40 ms</text><line x1="715" x2="1035" y1="274" y2="274" stroke="#30a2ff" stroke-width="3" marker-end="url(#itl-arrow)"/><text x="875" y="302" fill="#1769aa" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">ITL 40 ms</text><path fill="none" stroke="#ebb431" stroke-width="3" d="M350 326 V338 H1050 V326"/><text x="700" y="365" fill="#8a6500" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">80 ms generation span</text><rect width="520" height="124" x="56" y="398" fill="#edf7ff" stroke="#b8ddfa" rx="12"/><rect width="6" height="124" x="56" y="398" fill="#30a2ff" rx="3"/><text x="86" y="431" fill="#1769aa" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600">Mean ITL</text><text x="86" y="473" fill="#454545" font-family="Inter, system-ui, sans-serif" font-size="20">(40 ms + 40 ms) ÷ 2</text><text x="546" y="468" fill="#1769aa" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="600" text-anchor="end">40 ms</text><text x="86" y="500" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="13">2 observed gaps between stream outputs</text><rect width="520" height="124" x="624" y="398" fill="#fff9e8" stroke="#ead79c" rx="12"/><rect width="6" height="124" x="624" y="398" fill="#ebb431" rx="3"/><text x="654" y="431" fill="#8a6500" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600">TPOT</text><text x="654" y="473" fill="#454545" font-family="Inter, system-ui, sans-serif" font-size="20">(180 − 100) ms ÷ (5 − 1)</text><text x="1114" y="468" fill="#8a6500" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="600" text-anchor="end">20 ms/token</text><text x="654" y="500" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="13">4 output tokens after the first</text></svg>